global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs: [{targets: ["node_exporter:9100"]}]

  - job_name: "containers"
    static_configs: [{targets: ["cadvisor:8080"]}]

  - job_name: "makola_api"
    static_configs: [{targets: ["api:4000"]}]
    metrics_path: /metrics
