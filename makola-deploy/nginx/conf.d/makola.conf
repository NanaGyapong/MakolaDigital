# ============================================================
# Makola Digital — Site Config (HTTPS)
# ============================================================

# Upstream services
upstream api_backend {
  server api:4000;
  keepalive 32;
}

upstream frontend_app {
  server frontend:3000;
  keepalive 16;
}

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name makoladigital.com www.makoladigital.com api.makoladigital.com;

  # Let certbot do its thing
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── MAIN SITE (makoladigital.com) ─────────────────────────────
server {
  listen 443 ssl http2;
  server_name makoladigital.com www.makoladigital.com;

  ssl_certificate /etc/letsencrypt/live/makoladigital.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/makoladigital.com/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Security
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://api.makoladigital.com wss://api.makoladigital.com;" always;

  limit_conn conn 20;
  limit_req zone=general burst=50 nodelay;

  # Next.js static files
  location /_next/static/ {
    proxy_pass http://frontend_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, immutable, max-age=31536000";
  }

  location /static/ {
    proxy_pass http://frontend_app;
    add_header Cache-Control "public, max-age=86400";
  }

  # Frontend app
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ── API SUBDOMAIN (api.makoladigital.com) ──────────────────────
server {
  listen 443 ssl http2;
  server_name api.makoladigital.com;

  ssl_certificate /etc/letsencrypt/live/makoladigital.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/makoladigital.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000" always;

  # CORS headers for API
  add_header Access-Control-Allow-Origin "https://makoladigital.com" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
  add_header Access-Control-Allow-Credentials "true" always;

  # Handle OPTIONS preflight
  if ($request_method = OPTIONS) {
    return 204;
  }

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|forgot-password) {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket for real-time messaging
  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
  }

  # Payment webhooks (no rate limit — Paystack/Flutterwave IPs)
  location ~ ^/api/v1/payments/webhook {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # All other API routes
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # Health check (no auth required)
  location /health {
    proxy_pass http://api_backend;
    access_log off;
  }
}
