version: "3.9"

# ============================================================
# MAKOLA DIGITAL — Production Docker Compose
# Services: API · Frontend · PostgreSQL · Redis · Nginx
# ============================================================

networks:
  makola_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  uploads_data:

services:

  # ── POSTGRESQL ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: makola_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makola_db}
      POSTGRES_USER: ${POSTGRES_USER:-makola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks: [makola_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makola} -d ${POSTGRES_DB:-makola_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # Only accessible on loopback

  # ── REDIS ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: makola_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [makola_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  # ── BACKEND API ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: makola_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-makola}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-makola_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - uploads_data:/app/uploads
    networks: [makola_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # ── FRONTEND ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.makoladigital.com/api/v1}
    container_name: makola_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks: [makola_net]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── NGINX REVERSE PROXY ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: makola_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    networks: [makola_net]
    depends_on: [api, frontend]

  # ── CERTBOT (SSL) ──────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: makola_certbot
    volumes:
      - nginx_certs:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks: [makola_net]
